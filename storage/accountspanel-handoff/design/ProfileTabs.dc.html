<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Profile tabs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; color: #111827; font-size: 14px">
<nav aria-label="Profile modules" style="display: flex; gap: 4px; overflow-x: auto; max-width: 100%">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
<a href="{{t.href}}" style="{{t.style}}">
<span>{{t.label}}</span>
<span style="{{t.countStyle}}">{{t.count}}</span>
</a>
</sc-for>
</nav>
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0">
<button aria-label="Notifications" style="width: 38px; height: 38px; border: 1px solid #e5e7eb; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #374151; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
</button>
<div style="width: 34px; height: 34px; border-radius: 50%; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">SU</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["profiles","customers","suppliers","lenders","owners","employees"],"default":"profiles"},"$preview":{"width":1100,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'profiles';
    var base = 'display: flex; align-items: center; gap: 8px; padding: 20px 14px 18px; white-space: nowrap; text-decoration: none; border-bottom: 3px solid ';
    var defs = [
      { key: 'profiles', label: 'Master Profiles', count: '242', href: 'Profiles.dc.html' },
      { key: 'customers', label: 'Customers', count: '199', href: 'Customers.dc.html' },
      { key: 'suppliers', label: 'Suppliers', count: '24', href: 'Suppliers.dc.html' },
      { key: 'lenders', label: 'Lenders', count: '3', href: 'Lenders.dc.html' },
      { key: 'owners', label: 'Owners', count: '2', href: 'Owners.dc.html' },
      { key: 'employees', label: 'Employees', count: '8', href: 'Employees.dc.html' }
    ];
    return {
      tabs: defs.map(function (d) {
        var on = active === d.key;
        return Object.assign({}, d, {
          style: base + (on ? '#4f46e5; color: #312e81; font-weight: 700' : 'transparent; color: #4b5563; font-weight: 500'),
          countStyle: 'font-size: 11.5px; font-weight: 700; border-radius: 10px; padding: 1px 8px; ' + (on ? 'background: #e0e7ff; color: #3730a3' : 'background: #f3f4f6; color: #4b5563')
        });
      })
    };
  }
}
</script>
</body>
</html>
